[build-system]
requires = ["hatchling>=1.22"]
build-backend = "hatchling.build"

[project]
name = "chimera-mlssl"
version = "0.1.0"
description = "Chimera: Multimodal SSL with gated common/unique splits (DeCUR + VICReg)."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "German D.", email = "German.Devchich@skoltech.ru" }]
license = { text = "MIT" }

# torch/torchvision не фиксируем здесь — ставим в Docker с нужным CUDA.
dependencies = [
  "numpy>=1.24",
  "pandas>=2.0",
  "pyyaml>=6.0",
  "tqdm>=4.66",
  "matplotlib>=3.7",
  "typing-extensions>=4.8",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.4", "mypy>=1.10"]
viz = ["tensorboard>=2.14", "rich>=13.7"]
pl = [
  "pytorch-lightning>=2.4.0",
  "torchmetrics>=1.3.0",
  "lightning-utilities>=0.11.0",
]
clearml = ["clearml>=1.15"]

[project.scripts]
chimera-train = "chimera.train.train:main"
chimera-eval  = "chimera.scripts.eval_cli:main"
chimera-pl-train = "chimera.train.pl_cli:main"

[tool.hatch.build.targets.wheel]
packages = ["chimera"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.mypy]
python_version = "3.10"
strict = true
warn_unused_ignores = true